<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18283F"/>
      <stop offset="1" stop-color="#0A111C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4DA6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4DA6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22344F"/>
      <stop offset="1" stop-color="#14213A"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#E9A21E"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#4DA6FF" stroke-opacity="0.25" stroke-width="4"/>
  <circle cx="256" cy="256" r="250" fill="url(#glow)"/>

  <!-- L'infobulle d'un objet -->
  <g filter="url(#shadow)">
    <rect x="88" y="108" width="336" height="296" rx="36" fill="url(#card)" stroke="#63B5FF" stroke-opacity="0.55" stroke-width="6"/>
  </g>
  <rect x="124" y="148" width="64" height="64" rx="14" fill="#63B5FF" fill-opacity="0.85"/>
  <rect x="210" y="160" width="170" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="210" y="188" width="110" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="124" y="246" width="256" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="124" y="270" width="200" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Les prix ajoutés -->
  <rect x="124" y="312" width="132" height="14" rx="7" fill="#FFD978"/>
  <rect x="124" y="342" width="96" height="12" rx="6" fill="#FFD978" fill-opacity="0.55"/>

  <!-- La pièce -->
  <g filter="url(#shadow)">
    <circle cx="372" cy="356" r="70" fill="url(#coin)" stroke="#0A111C" stroke-width="10"/>
    <circle cx="372" cy="356" r="46" fill="none" stroke="#FFF3CF" stroke-opacity="0.75" stroke-width="8"/>
    <text x="372" y="378" text-anchor="middle" font-family="Georgia, 'DejaVu Serif', serif" font-weight="bold" font-size="62" fill="#8A5A08">G</text>
  </g>
</svg>
